set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style

# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind x kill-pane
bind c swap-pane -D
bind S choose-session
bind R source-file ~/.tmux.conf

# Use vim key bindings in copy mode
setw -g mode-keys vi

# Start copy mode with prefix + [
bind [ copy-mode

# Scroll up/down with vim keys
bind -T copy-mode-vi 'k' send -X cursor-up
bind -T copy-mode-vi 'j' send -X cursor-down

# Start selection with 'v' (like vim visual mode)
bind -T copy-mode-vi 'v' send -X begin-selection

# Copy selection with 'y'
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Ensure tmux mouse scroll also triggers copy-mode (optional but recommended)
set -g mouse on

# Color scheme
teal_dark="#21BFC2"
teal_light="#59E3E3"
blue_dark="#26BBD9"
red_light="#EC6A88"
orange_dark="#FAB795"
orange_light="#FBC3A7"

# Status bar customization
set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${teal_dark},bg=default"
set -g status-left "#[fg=${teal_dark},bold]   #S #[fg=${blue_dark}] |"
set -g status-right "#[fg=${orange_light}] %m-%d-%Y #[fg=${red_light}]%H:%M #[default]"
set -g window-status-current-format "#[fg=${blue_dark},bold]  #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${red_light},bg=default"
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=${teal_dark}"

set -g set-titles on
set -g set-titles-string "#S"
